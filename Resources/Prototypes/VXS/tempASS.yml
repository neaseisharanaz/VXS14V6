- type: entity
  id: CapturePointRule
  parent: BaseGameRule
  components:
  - type: CapturePointGameRule
  - type: RespawnDeadRule
    alwaysRespawnDead: true
  - type: RespawnTracker
    respawnDelay: 10
    deleteBody: false
  - type: CaptureTickets
  - type: TicketDisplay
    displayInterval: 60

- type: gamePreset
  id: CapturePoint
  alias:
    - PointCapture
  name: pointcapture-title
  description: pointcapture-description
  maxPlayers: 100
  showInVote: true
  rules:
    - CapturePointRule
