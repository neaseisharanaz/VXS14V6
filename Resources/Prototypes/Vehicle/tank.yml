- type: entity
  id: ADTBase40mmGrenade
  name: base 40 mm grenade
  parent: [BaseItem, BaseMajorContraband]
  abstract: true
  components:
  - type: Tag
    tags:
    - ADT40mmGrenade
  - type: Item
    size: Tiny
  - type: Sprite
  - type: CartridgeAmmo
    deleteOnSpawn: true

- type: entity
  id: ADT40mmGrenadeBlast
  name: 40 mm blast grenade
  parent: ADTBase40mmGrenade
  components:
  - type: CartridgeAmmo
    proto: ADTBullet40mmGrenadeBlast
  - type: Sprite
    sprite: VXS1/Weapons/Ammo/Explosives/40mm_grenade.rsi
    layers:
    - state: he
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: ADTBullet40mmGrenadeBlast
  name: blast grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
      - state: grenade
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120 # about a ~4 tile radius
    canCreateVacuum: false
  - type: ProjectileGrenade
    fillPrototype: PelletClusterLethal
    capacity: 30
  - type: SmokeOnTrigger # VXS
    duration: 3
    spreadAmount: 4
  - type: FlashOnTrigger # VXS
    range: 4

- type: entity
  id: IFVHexalit
  parent: SDVatTank
  name: IFV-17 Hexalit
  description: Wow, IFV made from plastic
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Fun/btr.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: k17
  - type: Physics
    bodyType: Dynamic
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSkates
  - type: AmbientSound
    range: 5
    volume: -6
    sound:
      path: /Audio/VXS/Effects/vehicleengineidle.ogg
  - type: Armor
    showArmorOnExamine: false
    modifiers:
      coefficients:
        Blunt: 0
        Slash: 0
        Piercing: 0.3
        Heat: 0.1
      flatReductions:
        Piercing: 70
        Asphyxiation: 100
  - type: Mech
    baseState: k17
    openState: k17-open
    brokenState: k17-broken
    maxintegrity: 500
    startingEquipment: ["MechGun2A75","MechGunAGS","ADTMechGunUltraAC2"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCellAntiqueProto
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 1
    friction: 1
    frictionNoInput: 1
    baseWalkSpeed: 4.5
    baseSprintSpeed: 7
  - type: DamageContacts
    damage:
      types:
        Blunt: 5
    ignoreWhitelist:
      tags:
      - Flesh

