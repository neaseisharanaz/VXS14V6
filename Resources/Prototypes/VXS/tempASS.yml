#Syndie
- type: entity
  parent: MobHuman
  id: VXSSyndy
  name: syndicate agent VXS
  suffix: Human, Base
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
    hair: HairBald
  - type: Loadout
    prototypes: [SyndicateOperativeGearExtremelyBasic]
    roleLoadout: [ RoleSurvivalSyndicate ]
  - type: RandomMetadata
    nameSegments: [NamesDeathCommando]
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: GGSyndyTeam



