- type: entity
  id: EAB250UMPKAviaBomb
  parent: BaseStructureDynamic
  name: EAB-250 UMPK
  description: An aerial bomb with a planning and correction module, it has a good accuracy. Equipped with a thermally protected head and is used for attacks on ground targets.
  components:
  - type: Sprite
    sprite: VXS/Weapons/Ammunition/Explosives/fab500umpk.rsi
    state: icon
  - type: Pullable
  - type: AerialBomb
    flightTime: 16
    dispersionRadius: 4
    arrivalSound: /Audio/VXS/Artillery/aviabomb.ogg
    preImpactDelay: 3
    impactEntity: BombMarker250
  - type: WeaponMonitoringProfile
    category: AerialBomb
    fov: 0
    seekerType: INS correction
    warheadType: High explosive Fragmentation
    flightTime: 16
    deviation: 4
    projectileSpeed: 0
    notes: Unguided aerial bomb.
  - type: TriggerOnSignal
    port: Trigger

- type: entity
  id: BombMarker250
  categories: [ HideSpawnMenu ]
  name: Bomb marker 250
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn
  - type: DeleteOnTrigger
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 1000
    intensitySlope: 10
    maxIntensity: 50
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: PelletClusterLethalHeavy
    capacity: 50
    randomAngle: false
    MaxVelocity: 15
    MinVelocity: 10
  - type: SmokeOnTrigger
    keysIn:
    - trigger
    duration: 10
    spreadAmount: 20
  - type: TimedDespawn
    lifetime: 15

